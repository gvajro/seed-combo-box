# A ogni push su main: se la versione nell'header del plugin non ha ancora una release,
# crea tag e release. I siti WordPress la vedono come aggiornamento.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versione del plugin
        id: version
        run: echo "tag=v$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' seed-combo-box.php)" >> "$GITHUB_OUTPUT"

      - name: Crea la release se manca
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG già presente: per aggiornare i siti alza Version in seed-combo-box.php"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
